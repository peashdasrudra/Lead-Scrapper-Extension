<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps Lead Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="url(#logo-grad)"/>
        <defs>
          <linearGradient id="logo-grad" x1="5" y1="2" x2="19" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00d2ff" />
            <stop offset="1" stop-color="#a100ff" />
          </linearGradient>
        </defs>
      </svg>
      <div class="brand">
        <h1>Maps Scraper</h1>
        <span class="badge">PRO</span>
      </div>
    </div>

    <div class="description-text">
      Extract verified B2B leads directly from Google Maps into CSV files.
    </div>

    <form id="quick-start-form">
      <div class="input-group">
        <label for="keyword">Keyword</label>
        <input type="text" id="keyword" placeholder="e.g. Dentist, Restaurant, Plumber" required autofocus>
      </div>

      <div class="input-group">
        <label for="city">City / Area</label>
        <input type="text" id="city" placeholder="e.g. Chicago, New York, London" required>
      </div>

      <div class="input-group">
        <label for="limit">Target Leads</label>
        <input type="number" id="limit" value="100" min="1" max="1000" required>
      </div>

      <button type="submit" class="btn-primary">
        <span>Launch Scraper Dashboard</span>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="footer">
      <div class="info-row">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Runs in a persistent tab to prevent interruption.</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
